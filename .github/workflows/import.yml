name: Import external activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Import all sources
        run: deno run --allow-read --allow-write --allow-net --allow-env --allow-run scripts/import-all.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh interaction stats
        run: deno run --allow-read --allow-write --allow-net --allow-env scripts/fetch-interactions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch webmentions
        if: ${{ vars.WEBMENTIONS_ENABLED == 'true' }}
        run: deno run --allow-read --allow-write --allow-net --allow-env scripts/fetch-webmentions.ts
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ content/feed/ static/media/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "import: refresh external activity"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  # Pushes made with GITHUB_TOKEN don't trigger the push workflow,
  # so the deploy is invoked explicitly.
  deploy:
    needs: import
    if: ${{ needs.import.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
